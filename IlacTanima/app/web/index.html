<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlaç Tanıma Sistemi v3.0</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:   #0d0d1a;
    --bg-dark:   #13132a;
    --bg-card:   #1a1a35;
    --bg-panel:  #111128;
    --border:    #1e2a50;
    --accent:    #4a9eff;
    --green:     #4caf50;
    --red:       #f44336;
    --amber:     #ff8f00;
    --text:      #c8d4ec;
    --text-dim:  #5a6a8a;
    --text-head: #7a8aaa;
  }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 600; color: var(--accent); letter-spacing: 0.03em; }
  .chip {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .chip-idle  { background: #1a2550; color: #6a8acc; }
  .chip-found { background: #0d3d20; color: var(--green); }
  .hw-tag { margin-left: auto; font-size: 0.72rem; color: var(--text-dim); }

  /* ── Main layout ── */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Camera panel ── */
  .cam-wrap {
    flex: 6;
    background: #08080f;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .cam-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .cam-overlay {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hud-badge {
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-family: 'Consolas', monospace;
  }
  .hud-fps  { color: var(--green); }
  .hud-det  { color: var(--accent); }

  /* ── Info panel ── */
  .info-panel {
    flex: 4;
    background: var(--bg-dark);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .info-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* Status bar */
  .status-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #6a8acc;
    margin-bottom: 12px;
    transition: background 0.3s, color 0.3s;
  }
  .status-bar.found { background: #0b3320; color: var(--green); border-color: #1a5532; }

  /* Drug card */
  .drug-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .drug-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  .field-group { margin-top: 8px; }
  .field-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-head);
    margin-bottom: 2px;
  }
  .field-value { font-size: 0.875rem; color: var(--text); line-height: 1.4; }

  .sgk-yes    { color: var(--green); font-weight: 600; }
  .sgk-no     { color: var(--red);   font-weight: 600; }
  .sgk-unknown{ color: var(--text-dim); }

  /* Warnings */
  .warnings {
    background: #2a1800;
    border: 1px solid var(--amber);
    border-radius: 6px;
    padding: 9px 12px;
    margin-top: 10px;
    font-size: 0.82rem;
    color: #ffb74d;
    display: none;
    line-height: 1.5;
  }

  /* History */
  .section-title {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .history-list { list-style: none; }
  .history-list li {
    font-size: 0.8rem;
    color: #8898bb;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-list li:last-child { border-bottom: none; }

  /* ── Footer ── */
  footer {
    background: #09090f;
    border-top: 1px solid var(--border);
    padding: 5px 16px;
    font-size: 0.68rem;
    color: var(--text-dim);
    display: flex;
    gap: 24px;
    flex-shrink: 0;
  }
  footer span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>İlaç Tanıma Sistemi</h1>
  <span class="chip chip-idle" id="statusChip">TARAMA BEKLENİYOR</span>
  <span class="hw-tag">Raspberry Pi 5 &nbsp;·&nbsp; IMX500 NPU</span>
</header>

<main>

  <!-- Kamera paneli -->
  <div class="cam-wrap">
    <img id="camFeed" src="/api/video/stream" alt="Canlı görüntü">
    <div class="cam-overlay">
      <div class="hud-badge hud-fps" id="fpsBadge">FPS: --</div>
      <div class="hud-badge hud-det" id="detBadge">Tespit: 0</div>
    </div>
  </div>

  <!-- Bilgi paneli -->
  <div class="info-panel">
    <div class="info-scroll">

      <div class="status-bar" id="statusBar">TARAMA BEKLENİYOR</div>

      <div class="drug-card">
        <div class="drug-name" id="drugName">—</div>
        <hr class="divider">

        <div class="field-group">
          <div class="field-label">Etkin Madde</div>
          <div class="field-value" id="activeIng">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">Firma</div>
          <div class="field-value" id="company">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">Dozaj</div>
          <div class="field-value" id="dosage">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">ATC Kodu</div>
          <div class="field-value" id="atcCode">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">Reçete Türü</div>
          <div class="field-value" id="rxType">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">SGK Durumu</div>
          <div class="field-value sgk-unknown" id="sgkStatus">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">Barkod</div>
          <div class="field-value" id="barcodeVal">—</div>
        </div>

        <div class="warnings" id="warningsBox"></div>
      </div>

      <div class="section-title">Son Tespitler</div>
      <ul class="history-list" id="historyList"></ul>

    </div>
  </div>

</main>

<footer>
  <span id="connStatus">Bağlanıyor...</span>
  <span id="barcodeStatus"></span>
  <span id="ocrStatus"></span>
</footer>

<script>
  "use strict";

  const historyItems = [];

  // ── Elementler ──────────────────────────────────────────────────────────────
  const el = id => document.getElementById(id);

  const $statusChip  = el("statusChip");
  const $statusBar   = el("statusBar");
  const $fpsBadge    = el("fpsBadge");
  const $detBadge    = el("detBadge");
  const $drugName    = el("drugName");
  const $activeIng   = el("activeIng");
  const $company     = el("company");
  const $dosage      = el("dosage");
  const $atcCode     = el("atcCode");
  const $rxType      = el("rxType");
  const $sgkStatus   = el("sgkStatus");
  const $barcodeVal  = el("barcodeVal");
  const $warningsBox = el("warningsBox");
  const $historyList = el("historyList");
  const $connStatus  = el("connStatus");
  const $barcodeStatus = el("barcodeStatus");
  const $ocrStatus   = el("ocrStatus");

  // ── WebSocket ───────────────────────────────────────────────────────────────
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/live`);

    ws.onopen = () => {
      $connStatus.textContent = "Bağlı — canlı akış";
    };

    ws.onmessage = ({ data }) => {
      try { update(JSON.parse(data)); } catch (_) {}
    };

    ws.onclose = () => {
      $connStatus.textContent = "Bağlantı kesildi — 2sn sonra tekrar denenecek";
      setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  // ── Güncelleme ──────────────────────────────────────────────────────────────
  function update(data) {
    // HUD
    if (data.fps != null) $fpsBadge.textContent = `FPS: ${data.fps}`;
    $detBadge.textContent = `Tespit: ${data.detections ?? 0}`;

    if (data.barcode) $barcodeStatus.textContent = `Barkod: ${data.barcode}`;
    if (data.ocr_text) $ocrStatus.textContent = `OCR: ${data.ocr_text}`;

    const drug = data.drug;
    if (drug) {
      $statusChip.textContent = "İLAÇ TESPİT EDİLDİ";
      $statusChip.className   = "chip chip-found";
      $statusBar.textContent  = "İLAÇ TESPİT EDİLDİ";
      $statusBar.className    = "status-bar found";

      $drugName.textContent   = drug.name   || "—";
      $activeIng.textContent  = drug.active_ingredient || "—";
      $company.textContent    = drug.company  || "—";
      $dosage.textContent     = drug.dosage   || "—";
      $atcCode.textContent    = drug.atc_code || "—";
      $rxType.textContent     = drug.prescription_type || "—";
      $barcodeVal.textContent = drug.barcode  || "—";

      // SGK
      const sgk = drug.sgk_status || "Bilinmiyor";
      $sgkStatus.className = "field-value";
      if (/geri ödeni/i.test(sgk) || sgk === "Evet") {
        $sgkStatus.textContent = `✔  ${sgk}`;
        $sgkStatus.classList.add("sgk-yes");
      } else if (/ödenm/i.test(sgk) || sgk === "Hayır") {
        $sgkStatus.textContent = `✘  ${sgk}`;
        $sgkStatus.classList.add("sgk-no");
      } else {
        $sgkStatus.textContent = sgk;
        $sgkStatus.classList.add("sgk-unknown");
      }

      // Uyarılar
      if (drug.warnings) {
        $warningsBox.textContent  = `⚠  ${drug.warnings}`;
        $warningsBox.style.display = "block";
      } else {
        $warningsBox.style.display = "none";
      }

      // Geçmiş
      if (drug.name && !historyItems.includes(drug.name)) {
        historyItems.unshift(drug.name);
        if (historyItems.length > 20) historyItems.pop();
        $historyList.innerHTML = historyItems
          .map(n => `<li>${n}</li>`)
          .join("");
      }
    }
  }

  connect();
</script>
</body>
</html>
